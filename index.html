<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore native Storage prototype method to prevent false LOGOUT triggers inside native WebView
      if (typeof window !== 'undefined' && window.Storage && window.localStorage) {
        try {
          window.localStorage.removeItem = Storage.prototype.removeItem.bind(window.localStorage);
        } catch (e) {}
      }
    </script>
    <title>InstaToken - Skip the OPD Waiting Lines. Book Digital OPD Tokens Online.</title>
    <meta name="description" content="InstaToken - Official Digital OPD Token Booking & Real-Time Hospital Queue Tracker. Book verified hospital tokens online and skip waiting lines." />
    <meta name="keywords" content="hospital token booking, digital OPD queue, skip line, secure medical appointment, book doctor online, real-time queue tracker" />
    <meta name="author" content="InstaToken Healthcare Technologies" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InstaToken - Skip the OPD Waiting Lines" />
    <meta property="og:description" content="Book digital OPD tokens online, track live queue positions, and consult doctors on schedule." />
    <meta property="og:image" content="/insta_token_banner.jpg" />
    <!-- Twitter Card -->

    <meta name="twitter:description" content="Book digital OPD tokens online, track live queue positions, and consult doctors on schedule." />
    <meta name="twitter:image" content="/insta_token_banner.jpg" />
